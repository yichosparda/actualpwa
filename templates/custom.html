<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">

    <!-- Manifest -->
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <!-- Service Worker -->
    <script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register("{{ url_for('static', filename='service-worker.js') }}")
        .then(() => console.log('Service Worker Registered'))
        .catch(err => console.error('Service Worker Registration Failed:', err));
    }
    </script>


<body>
    <header>
        <img src="{{ url_for('static', filename='bakery.png') }}" alt=""width="50px"">
        <h1 style = "text-align: left; margin-left: 1%;">NAME OF BAKERY</h1>
        <a href="cart" style="margin-left: auto;">
            <img src="{{ url_for('static', filename='icons/cart.png') }}" alt=""width="50px">
        </a>
    </header>

    <div style = "border-bottom: 2px solid #84592B; margin-left : 2%; margin-right: 2%;"></div>

    <div class = "subheader">
        <div class = "buttoncontainer">
            <a class="buttonlink" href="/">HOME</a>
            <a class="buttonlink" href="menu" >MENU</a>
            <a class="buttonlink" >CUSTOM</a>
        </div>
        <div class = "linkcontainer">
            <a href="menu#cakes">CAKES</a>
            <a href="menu#breads">BREADS</a>
            <a href="menu#pies">PIES</a>
            <a href="menu#cookies">COOKIES</a>
            <a href="menu#others">OTHERS</a>
        </div>
    </div>

    <div style = "border-bottom: 2px solid #84592B; margin-left : 2%; margin-right: 2%;"></div>

    <div style="display:grid;place-items:center; width: 100%; margin-top:5%;">
        <h3>didn't find what you were looking for?</h3>
        <p>sign in and submit a request and we'll see what we can do!</p> 
    </div>

    <div class ="requestcontainer">
        <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo" width="40%">
        <div class="requestinner">
            <form method="POST">
                <textarea name='request' maxlength="1000" required placeholder="max 1000 characters"></textarea>
                <button type="submit" class="buttonlink" style="margin-left: auto;">submit</button>
            </form>
        </div>
    </div>
    

</body>
</html>
