<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Responsive Image Slider</title>

    <!-- Swiper CSS -->
    <link rel="stylesheet"href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <div class="card_container swiper">
        <div class="slider-wrapper">
        <div class="card-list swiper-wrapper">

            <div class="card-item swiper-slide">
            <img src="images/img-1.jpg" alt="User Image" class="user-image" />
            <h2 class="user-name">James Wilson</h2>
            <p class="user-profession">Software Developer</p>
            <button class="message-button">Message</button>
            </div>

            <div class="card-item swiper-slide">
            <img src="images/img-2.jpg" alt="User Image" class="user-image" />
            <h2 class="user-name">Michael Brown</h2>
            <p class="user-profession">Graphic Designer</p>
            <button class="message-button">Message</button>
            </div>

            <div class="card-item swiper-slide">
            <img src="images/img-3.jpg" alt="User Image" class="user-image" />
            <h2 class="user-name">Sophia Garcia</h2>
            <p class="user-profession">Online Teacher</p>
            <button class="message-button">Message</button>
            </div>

            <div class="card-item swiper-slide">
            <img src="images/img-4.jpg" alt="User Image" class="user-image" />
            <h2 class="user-name">Emily Johnson</h2>
            <p class="user-profession">Content Writer</p>
            <button class="message-button">Message</button>
            </div>

            <div class="card-item swiper-slide">
            <img src="images/img-5.jpg" alt="User Image" class="user-image" />
            <h2 class="user-name">Daniel Martinez</h2>
            <p class="user-profession">Photographer</p>
            <button class="message-button">Message</button>
            </div>

        </div>

        <div class="swiper-pagination"></div>

        <div class="swiper-slide-button swiper-button-prev"></div>
        <div class="swiper-slide-button swiper-button-next"></div>
        </div>
    </div>

    <!-- Swiper JS -->
    <script src="static/swiper-bundle.min.js"></script>

    <!-- Custom JS -->
    <script src="script.js"></script>

</body>
</html>
